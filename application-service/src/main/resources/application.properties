spring.application.name=application-service

server.port=8084

# 2. Cau hinh ket noi PostgreSQL
# Luu y: Thay ten database, username va password theo dung tai khoan PostgreSQL tren may cua ban
spring.datasource.url=jdbc:postgresql://localhost:5432/application_service
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# 3. Cau hinh JPA / Hibernate
# ddl-auto=none: Khong tu tao bang vi da quan ly qua file job-schema.sql
spring.jpa.hibernate.ddl-auto=none

# 4. Hien thi cau lenh SQL trong Console khi chay (giup debug de dang)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

logging.level.root=INFO
logging.level.com.dacn.application_service=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE