# 1. ??nh danh service và c?ng ch?y
spring.application.name=api-gateway
server.port=8080

# 2. C?u hình Eureka Client
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/

# 3. C?u hình Logging
logging.level.root=INFO

# Logging ph?c v? Debug
logging.level.org.springframework.cloud.gateway=TRACE
logging.level.org.springframework.cloud.loadbalancer=TRACE
logging.level.org.springframework.web=DEBUG

# Hi?n th? thông tin exception khi ki?m th? local
server.error.include-message=always
server.error.include-stacktrace=always
server.error.include-exception=true

# 4. Application Service Route
spring.cloud.gateway.server.webmvc.routes[0].id=application-service
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://application-service
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/applications,/applications/**

# 5. Job Service Route
spring.cloud.gateway.server.webmvc.routes[1].id=job-service
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://job-service
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/jobs,/jobs/**

# 6. User Service Route
spring.cloud.gateway.server.webmvc.routes[2].id=user-service
spring.cloud.gateway.server.webmvc.routes[2].uri=lb://user-service
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/users,/users/**

# 7. Resume Service Route
spring.cloud.gateway.server.webmvc.routes[3].id=resume-service
spring.cloud.gateway.server.webmvc.routes[3].uri=lb://resume-service
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/resumes,/resumes/**

# 8. Auth Service Route
spring.cloud.gateway.server.webmvc.routes[4].id=auth-service
spring.cloud.gateway.server.webmvc.routes[4].uri=lb://auth-service
spring.cloud.gateway.server.webmvc.routes[4].predicates[0]=Path=/auth,/auth/**

# 9. Discovery Server Dashboard Route
spring.cloud.gateway.server.webmvc.routes[5].id=discovery-server
spring.cloud.gateway.server.webmvc.routes[5].uri=http://localhost:8761
spring.cloud.gateway.server.webmvc.routes[5].predicates[0]=Path=/eureka/web
spring.cloud.gateway.server.webmvc.routes[5].filters[0]=SetPath=/

# 10. Discovery Server Static Resources Route
spring.cloud.gateway.server.webmvc.routes[6].id=discovery-server-static
spring.cloud.gateway.server.webmvc.routes[6].uri=http://localhost:8761
spring.cloud.gateway.server.webmvc.routes[6].predicates[0]=Path=/eureka/**