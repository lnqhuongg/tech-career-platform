eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka
spring.application.name=api-gateway
server.port=0

logging.level.root=INFO
logging.level.org.springframework.cloud.gateway.route.RouteDefinitionLocator=INFO
logging.level.org.springframework.cloud.gateway=TRACE

## Application Service Route
spring.cloud.gateway.routes[0].id=application-service
spring.cloud.gateway.routes[0].uri=lb://application-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/applications

## Job Service Route
spring.cloud.gateway.routes[1].id=job-service
spring.cloud.gateway.routes[1].uri=lb://job-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/jobs
# ----

## User Service Route
spring.cloud.gateway.routes[2].id=user-service
spring.cloud.gateway.routes[2].uri=lb://user-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/users

## Resume Service Route
spring.cloud.gateway.routes[3].id=resume-service
spring.cloud.gateway.routes[3].uri=lb://resume-service
spring.cloud.gateway.routes[3].predicates[0]=Path=/resumes

## Auth Service Route
spring.cloud.gateway.routes[4].id=auth-service
spring.cloud.gateway.routes[4].uri=lb://auth-service
spring.cloud.gateway.routes[4].predicates[0]=Path=/auth

## Discovery Server Route
spring.cloud.gateway.routes[5].id=discovery-server
spring.cloud.gateway.routes[5].uri=lb://localhost:8761
spring.cloud.gateway.routes[5].predicates[0]=Path=/eureka/web
spring.cloud.gateway.routes[5].filters[0]=SetPath=/

## Discovery Server Static Resources Route
spring.cloud.gateway.routes[6].id=discovery-server-static
spring.cloud.gateway.routes[6].uri=lb://localhost:8761
spring.cloud.gateway.routes[6].predicates[0]=Path=/eureka/**