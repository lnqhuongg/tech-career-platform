# Cau hinh server port cho AuthService
spring.application.name=auth-service

server.port=8081

# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/auth_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
# Tui tu chay file SQL tao bang tren Postgre nen validate de tranh Hibernate tu dong ghi de/xoa bang
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT
app.jwt.secret-base64=${JWT_SECRET_BASE64}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
# FaifBYeGgj2ojrAmOefITN9Q4+Xa7FOg5Xw064SWugo=

# Refresh Token: 7 ngày
app.jwt.refresh-expiration-days=${JWT_REFRESH_EXPIRATION_DAYS:7}

#debug
logging.level.org.springframework.security=DEBUG