# =============================================================================
# RESUME SERVICE CONFIGURATION
# =============================================================================
spring.application.name=resume-service
server.port=${SERVER_PORT:8085}

# Database PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/resume_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Cấu hình Secret JWT dùng chung với auth-service & user-service
app.jwt.secret-base64=${JWT_SECRET_BASE64:FaifBYeGgj2ojrAmOefITN9Q4+Xa7FOg5Xw064SWugo=}

# Cấu hình Microservice AI (Python FastAPI - Sentence-BERT & LLM)
app.ai-service.url=${AI_SERVICE_URL:http://localhost:8000}

# Cấu hình thư mục lưu trữ file PDF upload
file.upload-dir=${FILE_UPLOAD_DIR:./uploads/resumes}

# Giới hạn dung lượng tải file
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB
