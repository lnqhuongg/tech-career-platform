# 1. ??nh danh service và c?ng ch?y
spring.application.name=job-service
server.port=8083

# 2. C?u hình k?t n?i PostgreSQL
# L?u ý: Thay ??i tên database, username và password
# theo ?úng thông tin PostgreSQL trên máy c?a b?n.
spring.datasource.url=jdbc:postgresql://localhost:5432/job-service?currentSchema=job_service
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# 3. C?u hình JPA / Hibernate
# ddl-auto=none: Không t? ??ng t?o ho?c c?p nh?t c?u trúc b?ng
# vì c?u trúc c? s? d? li?u ?ã ???c qu?n lý thông qua file job-schema.sql.
spring.jpa.hibernate.ddl-auto=none

# 4. Hi?n th? câu l?nh SQL trong Console
# H? tr? theo dõi và ki?m tra các câu truy v?n trong quá trình phát tri?n.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# 5. C?u hình Eureka Client
# ??a ch? c?a Eureka Discovery Server.
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka